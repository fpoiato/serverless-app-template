name: claude-analyze-error

# Análise das issues de erro (criadas pela Lambda <slug>-error-to-issue) pelo Claude Code, dentro da assinatura.
# O modelo só lê; quem escreve na issue é este workflow.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Número da issue de erro a (re)analisar
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: claude-analyze-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'type:error-backend') ||
      contains(github.event.issue.labels.*.name, 'type:error-frontend')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Montar prompt
        id: prompt
        run: |
          mkdir -p .agent-analysis
          {
            echo 'text<<PROMPT_EOF'
            sed -e "s/{{ISSUE}}/${{ inputs.issue || github.event.issue.number }}/g" -e "s#{{PROJECT}}#$(node -p "require('./project.config.json').displayName")#g" -e "s#{{REPO}}#${{ github.repository }}#g" \
                .github/prompts/error-analyst.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN com contents:read: o modelo não consegue push, merge nem editar a issue sozinho
      # além do que o workflow faz depois.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Glob,Grep,LS,Bash(gh issue view:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(cat:*)"

      - name: Publicar análise na issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = await import('node:fs');
            const issueNumber = Number('${{ inputs.issue || github.event.issue.number }}');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Texto do modelo também é neutralizado: pode ecoar conteúdo da evidência.
            const neutralize = (t, max) =>
              String(t ?? '')
                .replace(/@(?=[A-Za-z0-9-])/g, '@​')
                .replace(/\b(close[sd]?|fix(?:e[sd])?|resolve[sd]?)(\s+#\d+)/gi, '$1​$2')
                .slice(0, max);

            let result;
            try {
              result = JSON.parse(fs.readFileSync('.agent-analysis/result.json', 'utf8'));
            } catch (e) {
              core.warning(`result.json ausente ou inválido: ${e.message}`);
            }

            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: issueNumber });
            const marker = '<!-- analysis:pending -->';
            const section = result
              ? `## Análise (Claude)\n\n${neutralize(result.analysis, 12000)}\n\n<sub>Análise automática: ${run}</sub>`
              : `## Análise (Claude)\n\nNão foi possível gerar a análise automática. Run: ${run}`;

            let body = issue.body ?? '';
            body = body.includes(marker)
              ? body.replace(/## Análise[^\n]*\n[\s\S]*?<!-- analysis:pending -->/, section)
              : `${body}\n\n${section}`;

            const update = { ...context.repo, issue_number: issueNumber, body };
            if (result?.title) {
              const prefix = (issue.title.match(/^\[erro [a-z]+\]/) ?? ['[erro]'])[0];
              update.title = `${prefix} ${neutralize(result.title, 90)}`;
            }
            await github.rest.issues.update(update);
            core.info(result ? 'Análise publicada.' : 'Análise indisponível.');
