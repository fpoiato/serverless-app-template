name: pr-issue-link

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const { validate, issueFromBranch } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-link.mjs`);
            const pr = context.payload.pull_request;
            const n = issueFromBranch(pr.head.ref);
            let issue = null;
            if (n !== null) {
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: n }));
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
            const problems = validate({ branch: pr.head.ref, body: pr.body, issue });
            if (problems.length) core.setFailed(problems.join('\n'));
            else core.info(`PR vinculado à issue #${n}.`);
