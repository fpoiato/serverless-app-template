    id: comportamento
    attributes: { label: O que aconteceu }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: O que era esperado }
    validations: { required: true }
  - type: textarea
    id: passos
    attributes: { label: Passos para reproduzir }
  - type: input
    id: url
    attributes: { label: URL / tela }
